server:
  host: "0.0.0.0"
  port: 8080
  auth:
    enabled: true
    username: "admin"
    password: "changeme"

defaults:
  interval: "60s"

targets:
  - name: "Example Service"
    host: "192.168.1.100"
    checks: [ping, http]
    ports: [8080]
  - name: "Example Router"
    host: "192.168.1.1"
    checks: [ping, http]
    ports: [80, 443]

integrations:
  proxmox:
    enabled: false
    host: "https://192.168.1.20:8006"
    token_id: "homelab-dash@pam!monitoring"
    token_secret: "YOUR-TOKEN-SECRET-HERE"
    insecure_tls: true
    node: "pve"
  jellyfin:
    enabled: false
    host: ""
    api_key: ""
  nas:
    enabled: false
    smart_devices: []

alerts:
  - name: "Service down"
    condition: "status == down"
    duration: "5m"
    webhook: "https://hooks.slack.com/..."
