{{ define "layout" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homelab-dash</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <nav class="nav">
        <div class="nav-brand">homelab-dash</div>
        <a href="/" class="nav-link {{ if eq .ActivePage "overview" }}active{{ end }}">Overview</a>
        <a href="/services" class="nav-link {{ if eq .ActivePage "services" }}active{{ end }}">Services</a>
        <a href="/proxmox" class="nav-link {{ if eq .ActivePage "proxmox" }}active{{ end }}">Proxmox</a>
        <a href="/metrics" class="nav-link {{ if eq .ActivePage "metrics" }}active{{ end }}">Metrics</a>
        <a class="nav-link disabled">Security <span class="badge badge-unknown">soon</span></a>
    </nav>
    <main class="main">
        <header class="topbar">
            <div></div>
            <div class="topbar-right">
                <span class="muted">Last updated: <span id="last-updated">-</span></span>
            </div>
        </header>
        <div class="content">
            {{ template "content" . }}
        </div>
    </main>
    <script src="/static/js/app.js"></script>
    <script>connectSSE();</script>
</body>
</html>
{{ end }}
